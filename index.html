<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LIFF初期化テスト</title>
</head>
<body>
  <h2>LIFF初期化テスト</h2>
  <p id="status">確認前</p>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    async function initializeLiff() {
      const status = document.getElementById('status');

      status.textContent = 'LIFF初期化中...';

      try {
        // STEP287でLINE DevelopersのLIFF IDを設定する
        const liffId = '2012169883-Tx4vwK8u';

        await liff.init({ liffId: liffId });

        if (liff.isLoggedIn()) {

  const profile = await liff.getProfile();

  if (profile.userId) {

  const idToken = liff.getIDToken();

  if (idToken) {
    status.textContent =
      'LIFF初期化成功：IDトークン取得成功';
  } else {
    status.textContent =
      'LIFF初期化成功：IDトークン取得失敗';
  }

} else {
    status.textContent =
      'LIFF初期化成功：LINEユーザーID取得失敗';
  }

} else {

  status.textContent =
    'LIFF初期化成功：未ログイン';

}

      } catch (error) {
        status.textContent = 'LIFF初期化エラー';
        console.error(error);
      }
    }

    initializeLiff();
  </script>
</body>
</html>
